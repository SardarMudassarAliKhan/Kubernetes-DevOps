apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-devops-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-devops
  template:
    metadata:
      labels:
        app: kubernetes-devops
    spec:
      containers:
      - name: kubernetes-devops
        # The image tag will be replaced dynamically by GitHub Actions
        image: mudassaracr99.azurecr.io/kubernetes-devops:latest 
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi